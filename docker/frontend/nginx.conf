# The web image's whole configuration: the built bundle, served by Nginx as
# the unprivileged `nginx` user (uid 101) on 8080, so nothing is written
# outside /tmp. Security headers are the proxy's (docker/proxy/, ADR-0018).
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format    main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log    /dev/stdout main;
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The bundle is text and shrinks to under a third. HTML is always
    # compressed; images and fonts already are, so they are left alone.
    # Requests arrive through a proxy: Nginx proxies over HTTP/1.0 unless
    # told otherwise, and a CDN adds `Via`, which the defaults both refuse.
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_http_version 1.0;
    gzip_types        text/css text/plain text/javascript application/javascript application/json
                      application/manifest+json image/svg+xml;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        # Hashed asset names, so they can be cached indefinitely.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # The entry point must never be cached, or a deploy is invisible.
        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # Single-page app: unknown paths are routes, not missing files.
        location / {
            try_files $uri /index.html;
        }
    }
}
