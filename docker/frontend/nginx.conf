server {
    listen 8080;
    root /usr/share/nginx/html;

    # Hashed asset names, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The entry point must never be cached, or a deploy is invisible.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri /index.html;
    }
}
