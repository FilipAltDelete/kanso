# The one thing in front of an installation: `/` to the frontend, `/api` and
# `/health/live` to the API. A deployment can use any reverse proxy that does
# the same, including the headers in security-headers.conf, csp.conf and
# api.conf. That is why the frontend image proxies nothing itself.
#
# Served by the proxy image (Dockerfile beside this file, ADR-0018), whose
# main.conf works out the client's address and scheme.
server {
    listen 8080;
    client_max_body_size 1m;

    include /etc/nginx/kanso/csp.conf;
    include /etc/nginx/kanso/security-headers.conf;

    location /api {
        proxy_pass http://api:8080;
        include /etc/nginx/kanso/api.conf;
        proxy_read_timeout 60s;
    }

    # Liveness only. Readiness names each dependency and why it failed, so it
    # is for the platform, which asks the API container directly, as a
    # scraper does for /metrics. Neither is public.
    location = /health/live {
        proxy_pass http://api:8080;
        include /etc/nginx/kanso/api.conf;
    }

    location /health { return 404; }

    location = /metrics { return 404; }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        # The Vite dev server's hot-reload channel is a websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
