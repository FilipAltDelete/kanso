# The one thing in front of an installation: `/` to the frontend, `/api` and
# `/health` to the API. A deployment can use any reverse proxy that does the
# same, which is why the frontend image proxies nothing itself.
server {
    listen 8080;
    client_max_body_size 1m;

    location /api {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        # The Vite dev server's hot-reload channel is a websocket.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
