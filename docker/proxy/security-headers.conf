# The security headers on every response, errors included (`always`).
# Included at server level, so every location inherits them. Nginx drops
# *all* inherited add_header lines in a location that declares one of its
# own, so a location that needs its own add_header must include this file
# again. The policy itself is $kanso_csp (csp.conf, api.conf). ADR-0018.
add_header Content-Security-Policy   $kanso_csp always;
add_header X-Content-Type-Options    nosniff always;
add_header Referrer-Policy           same-origin always;
add_header Permissions-Policy        "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# Empty, so not sent, unless the request arrived over TLS (main.conf).
add_header Strict-Transport-Security $kanso_hsts always;

# The proxy owns these headers. An upstream's copy would reach the browser
# as a second header (API Platform sends its own X-Content-Type-Options).
proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Powered-By;
