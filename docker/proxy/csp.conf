# The Content Security Policy for the built frontend, which is what every
# installation serves. It allows exactly what the bundle loads: one module
# script and one stylesheet from this origin, and fetches to /api. There are
# no inline scripts or styles, fonts, eval or data: URIs. Styles React sets
# on elements go through the CSSOM, which style-src does not govern.
# PDFs are opened as links to object storage (a top-level navigation, not a
# fetch), so that origin needs no entry here. ADR-0018.
#
# The Vite dev server needs more (csp-dev.conf, mounted over this file by
# compose.yaml only).
set $kanso_csp "default-src 'self'";
set $kanso_csp "$kanso_csp; script-src 'self'";
set $kanso_csp "$kanso_csp; style-src 'self'";
set $kanso_csp "$kanso_csp; img-src 'self'";
set $kanso_csp "$kanso_csp; font-src 'self'";
set $kanso_csp "$kanso_csp; connect-src 'self'";
set $kanso_csp "$kanso_csp; object-src 'none'";
set $kanso_csp "$kanso_csp; base-uri 'none'";
set $kanso_csp "$kanso_csp; form-action 'self'";
set $kanso_csp "$kanso_csp; frame-ancestors 'none'";
