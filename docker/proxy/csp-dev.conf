# The policy for the Vite dev server only: compose.yaml mounts this file over
# csp.conf, and compose.prod.yaml and the image never use it. It is csp.conf
# plus what the dev server needs:
#   script-src 'unsafe-inline'  the inline React Refresh preamble in index.html
#   style-src  'unsafe-inline'  CSS injected as <style> elements
#   connect-src ws: wss:        the hot-reload websocket
set $kanso_csp "default-src 'self'";
set $kanso_csp "$kanso_csp; script-src 'self' 'unsafe-inline'";
set $kanso_csp "$kanso_csp; style-src 'self' 'unsafe-inline'";
set $kanso_csp "$kanso_csp; img-src 'self'";
set $kanso_csp "$kanso_csp; font-src 'self'";
set $kanso_csp "$kanso_csp; connect-src 'self' ws: wss:";
set $kanso_csp "$kanso_csp; object-src 'none'";
set $kanso_csp "$kanso_csp; base-uri 'none'";
set $kanso_csp "$kanso_csp; form-action 'self'";
set $kanso_csp "$kanso_csp; frame-ancestors 'none'";
