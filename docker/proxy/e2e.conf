# The end-to-end suite's entry point: the built frontend (e2e-web) instead
# of the Vite dev server, in front of the installation's API. A dev server
# reloads whenever a source file changes, which wipes a form a test is
# typing into; the built bundle is also what production serves.
server {
    listen 8080;
    client_max_body_size 2m;

    # Docker's DNS, looked up per request: e2e-web is rebuilt by every
    # `make e2e`, and a name resolved once at start would point at the old one.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api http://api:8080;
    set $web http://e2e-web:8080;

    location /api {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass $api;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $web;
        proxy_set_header Host $host;
    }
}
