# In every location that proxies to the API. ADR-0018.

# The API answers with JSON, never a page to render, so its policy allows nothing.
set $kanso_csp "default-src 'none'; frame-ancestors 'none'";

# The client's address and scheme as main.conf worked them out, not as the
# client claimed them. The API trusts this proxy for exactly these headers
# (TRUSTED_PROXIES), so anything else a client sends about the hop is dropped
# here. An empty value is not passed on.
proxy_set_header Host              $host;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $kanso_scheme;
proxy_set_header X-Forwarded-Port  $kanso_forwarded_port;
proxy_set_header X-Forwarded-Host  "";
proxy_set_header Forwarded         "";
