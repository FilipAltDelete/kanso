# The proxy image's main configuration (/etc/nginx/nginx.conf). It runs as the
# unprivileged `nginx` user (uid 101) and writes nothing outside /tmp. It also
# holds what every server in it shares: which peer may say where a request
# came from and over what, and so whether HSTS applies. The routes are in
# nginx.conf beside this file. ADR-0018.
worker_processes  auto;
error_log  /dev/stderr notice;
pid        /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    log_format    main  '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
    access_log    /dev/stdout main;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # PROXY_TRUSTED_PROXIES, rendered at start by trusted-proxies.sh:
    # `set_real_ip_from` for each entry, and $kanso_trusted_peer (1 when the
    # connection comes from one of them). Only such a peer's X-Forwarded-For
    # becomes $remote_addr.
    include /tmp/kanso-trusted-proxies.conf;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # The scheme the browser used: what a trusted peer says, or this hop's own.
    map "$kanso_trusted_peer:$http_x_forwarded_proto" $kanso_scheme {
        default   $scheme;
        "1:https" https;
        "1:http"  http;
    }

    # A trusted peer's X-Forwarded-Port; anyone else's is dropped.
    map $kanso_trusted_peer $kanso_forwarded_port {
        default "";
        1       $http_x_forwarded_port;
    }

    # HSTS only when the request arrived over TLS. An empty value is not
    # sent, so a plain-HTTP installation (development, a LAN) never pins
    # itself to HTTPS.
    map $kanso_scheme $kanso_hsts {
        default "";
        https   "max-age=31536000";
    }

    include /etc/nginx/conf.d/*.conf;
}
