# The container already runs as an unprivileged user.
worker_processes  auto;
error_log  /dev/stderr warn;
pid        /run/nginx/nginx.pid;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    off;                      # the app logs JSON to stdout with request_id
    sendfile      on;
    tcp_nopush    on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types application/json application/ld+json application/problem+json text/plain;
    gzip_proxied any;

    client_max_body_size 1m;                # uploads go straight to object storage
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;

    server {
        listen 8080 default_server;
        root /app/public;

        location / {
            try_files $uri /index.php$is_args$args;
        }

        location ~ ^/index\.php(/|$) {
            fastcgi_pass unix:/tmp/kanso/php-fpm.sock;
            fastcgi_split_path_info ^(.+\.php)(/.*)$;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_read_timeout 30s;
            internal;
        }

        location ~ \.php$ { return 404; }
    }
}
