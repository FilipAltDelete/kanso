# Reference deployment, built from generic container primitives only (same
# rule as Pimsen, ADR-0002): everything here must also hold for a plain
# container host. This file runs one installation locally with the source
# bind-mounted.
#
# Ports differ from Pimsen's (8080/13306/19000) so both stacks can run at once.

name: kanso

x-app-env: &app-env
  APP_ENV: "${APP_ENV:-dev}"
  APP_DEBUG: "${APP_DEBUG:-1}"
  APP_SECRET: "${APP_SECRET:-dev-secret-change-me}"
  DATABASE_URL: "mysql://kanso:kanso@mysql:3306/kanso?serverVersion=8.4.0&charset=utf8mb4"
  REDIS_URL: "redis://redis:6379"
  MESSENGER_TRANSPORT_DSN: "doctrine://default"
  S3_ENDPOINT: "http://minio:9000"
  S3_PUBLIC_ENDPOINT: "${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-19010}}"
  S3_BUCKET: "kanso"
  S3_KEY: "kanso"
  S3_SECRET: "kanso-secret"
  # Empty means the development default: admin / admin. Refused in prod.
  KANSO_ADMIN_EMAIL: "${KANSO_ADMIN_EMAIL:-}"
  KANSO_ADMIN_PASSWORD: "${KANSO_ADMIN_PASSWORD:-}"
  # Base64-encoded PEM keypair; `make keys` generates one into .env.
  JWT_SECRET_KEY: "${JWT_SECRET_KEY:-}"
  JWT_PUBLIC_KEY: "${JWT_PUBLIC_KEY:-}"

x-app-build: &app-build
  context: .
  dockerfile: docker/api/Dockerfile
  args:
    UID: "${UID:-1000}"
    GID: "${GID:-1000}"

x-app-volumes: &app-volumes
  - ./backend:/app
  - ./docker/api/php-dev.ini:/usr/local/etc/php/conf.d/zz-kanso.ini:ro

services:
  mysql:
    image: mysql:8.4
    command: ["--innodb-buffer-pool-size=256M"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kanso
      MYSQL_USER: kanso
      MYSQL_PASSWORD: kanso
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    ports: ["${MYSQL_PORT:-13316}:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    # Cache, locks and refresh tokens only — never queue data (queues are MySQL rows).
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "900", "1"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Labels, packing slips and import files (from Phase 1 on).
  minio:
    image: quay.io/minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: kanso
      MINIO_ROOT_PASSWORD: kanso-secret
    volumes: ["minio-data:/data"]
    ports: ["${MINIO_PORT:-19010}:9000", "${MINIO_CONSOLE_PORT:-19011}:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >-
      /bin/sh -c "mc alias set local http://minio:9000 kanso kanso-secret &&
                  mc mb --ignore-existing local/kanso &&
                  mc mb --ignore-existing local/kanso-test"
    restart: "no"

  # Migrations run to completion before any application container starts.
  migrate:
    build:
      <<: *app-build
      target: worker
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    restart: "no"

  # Creates the first administrator when the installation has no users.
  install:
    build:
      <<: *app-build
      target: worker
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      migrate: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}
    command: ["php", "bin/console", "kanso:install"]
    restart: "no"

  api:
    build:
      <<: *app-build
      target: api
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      install: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "php bin/console kanso:health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      <<: *app-build
      target: worker
    environment: *app-env
    volumes: *app-volumes
    depends_on:
      install: {condition: service_completed_successfully}
    # Workers exit on purpose when they hit their limits; restart brings them back.
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M", "--limit=1000"]
    restart: always

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      target: dev
      args:
        UID: "${UID:-1000}"
    environment:
      HMR_CLIENT_PORT: "${KANSO_PORT:-8090}"
    volumes:
      - ./frontend:/app
    restart: unless-stopped

  # `/` to the frontend, `/api` and `/health` to the API: the single entry
  # point an installation is reached through.
  proxy:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports: ["${KANSO_PORT:-8090}:8080"]
    depends_on: [api, frontend]
    restart: unless-stopped

  tools:
    build:
      <<: *app-build
      target: dev
    environment: *app-env
    volumes: *app-volumes
    profiles: ["tools"]
    command: ["php", "-v"]

volumes:
  mysql-data:
  redis-data:
  minio-data:
