# Layer boundaries (same as Pimsen): Api/Cli -> Application -> Domain <- Infrastructure.
# Contracts is the public API and depends on nothing internal (docs/extensions.md).
deptrac:
  paths:
    - ./src
    - ./contracts
  layers:
    - name: Contracts
      collectors:
        - type: directory
          value: contracts/.*
    - name: Domain
      collectors:
        - type: directory
          value: src/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: src/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: src/Infrastructure/.*
    - name: Api
      collectors:
        - type: directory
          value: src/Api/.*
    - name: Cli
      collectors:
        - type: directory
          value: src/Cli/.*
    # The two entry points: the kernel the reference installation boots, and
    # the bundle a customer project registers.
    - name: Kernel
      collectors:
        - type: classLike
          value: ^Kanso\\Core\\Internal\\Kernel$
        - type: classLike
          value: ^Kanso\\Core\\KansoCoreBundle$

  ruleset:
    Contracts: ~
    Domain:
      - Contracts
    Application:
      - Contracts
      - Domain
    Infrastructure:
      - Contracts
      - Domain
    Api:
      - Contracts
      - Domain
      - Application
    Cli:
      - Contracts
      - Domain
      - Application
    Kernel:
      - Contracts
