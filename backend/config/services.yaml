parameters:
    kanso.version: '0.1.0-dev'
    # S3-compatible stores that are not AWS ignore the region, but the client
    # needs one to sign with.
    kanso.s3.default_region: 'us-east-1'
    # The fallback for S3_PUBLIC_ENDPOINT has to be a parameter, not another env
    # var, so the internal endpoint is bound here to be fallen back to.
    kanso.s3.endpoint: '%env(string:default::S3_ENDPOINT)%'
    kanso.document_templates: '%kanso.core_dir%/templates/documents'
    # Which Redis database a test run uses (see when@test below).
    env(KANSO_TEST_REDIS_DB): '15'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            # Environment reaches application code only as bound parameters.
            $adminEmail: '%env(string:default::KANSO_ADMIN_EMAIL)%'
            $adminPassword: '%env(string:default::KANSO_ADMIN_PASSWORD)%'
            $environment: '%kernel.environment%'
            $loginLimiter: '@limiter.login'
            $apiKeyLimiter: '@limiter.api_key'
            # The code of the location orders reserve from when they name none.
            $defaultLocationCode: '%env(string:default::KANSO_DEFAULT_LOCATION)%'

    # A gauge is read at scrape time; implementing the interface is what puts
    # it on `/metrics`.
    _instanceof:
        Kanso\Core\Internal\Domain\Observability\MetricSourceInterface:
            tags: ['kanso.metric_source']

    Kanso\Core\Internal\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/KansoCoreBundle.php'
            - '../src/Domain/User/User.php'
            - '../src/Domain/User/Role.php'
            - '../src/Domain/Security/IssuedTokens.php'
            - '../src/Domain/Security/ApiKey.php'
            # Entities and values; the store interfaces are aliased below.
            - '../src/Domain/Order/'
            - '../src/Domain/Customer/'
            - '../src/Application/Customer/CustomerInput.php'
            - '../src/Application/Customer/Violations.php'
            - '../src/Domain/Document/{Document,DocumentType,DocumentStatus}.php'
            - '../src/Domain/Dashboard/{DashboardSummary,StockOut}.php'
            - '../src/Application/Document/{GenerateDocument,DocumentLabels,OrderDocumentData}.php'
            - '../src/Infrastructure/Security/ApiKeyRateLimited.php'
            - '../src/Application/Exception/'
            # Entities and values, not services.
            - '../src/Domain/Common/{Actor,Page,PageRequest,ConcurrentModification}.php'
            - '../src/Domain/Catalog/{Product,ProductEvent}.php'
            - '../src/Domain/Import/ImportRun.php'
            - '../src/Domain/Inventory/{Address,Location,InventoryLevel,InventoryMovement,StockChange,StockRuleViolated,AdjustmentReason,MovementType}.php'
            - '../src/Api/Resource/'

    Kanso\Core\Internal\Api\Controller\:
        resource: '../src/Api/Controller/'
        tags: ['controller.service_arguments']

    # Layering: Api/Cli -> Application -> Domain <- Infrastructure. The layers
    # above depend on these Domain interfaces; Infrastructure implements them.
    Kanso\Core\Internal\Domain\User\UserStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\UserRepository'
    Kanso\Core\Internal\Domain\Security\PasswordHasherInterface: '@Kanso\Core\Internal\Infrastructure\Security\SymfonyPasswordHasher'
    Kanso\Core\Internal\Domain\Security\AccessTokenIssuerInterface: '@Kanso\Core\Internal\Infrastructure\Security\LexikAccessTokenIssuer'
    Kanso\Core\Internal\Domain\Security\RefreshTokenStoreInterface: '@Kanso\Core\Internal\Infrastructure\Security\RedisRefreshTokenStore'
    Kanso\Core\Internal\Domain\Security\ApiKeyStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\ApiKeyRepository'
    Kanso\Core\Internal\Domain\Order\OrderStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\OrderRepository'
    Kanso\Core\Internal\Domain\Order\ChannelStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\ChannelRepository'
    Kanso\Core\Internal\Domain\Common\TransactionInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\DoctrineTransaction'
    Kanso\Core\Internal\Domain\Catalog\ProductStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\ProductRepository'
    Kanso\Core\Internal\Domain\Import\ImportRunStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\ImportRunRepository'
    Kanso\Core\Internal\Domain\Inventory\LocationStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\LocationRepository'
    Kanso\Core\Internal\Domain\Inventory\InventoryStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\InventoryRepository'
    Kanso\Core\Internal\Domain\Customer\CustomerStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\CustomerRepository'
    Kanso\Core\Internal\Domain\Document\DocumentStoreInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\Repository\DocumentRepository'
    Kanso\Core\Internal\Domain\Document\TemplateRendererInterface: '@Kanso\Core\Internal\Infrastructure\Document\TwigTemplateRenderer'
    Kanso\Core\Internal\Domain\Document\PdfRendererInterface: '@Kanso\Core\Internal\Infrastructure\Document\DompdfRenderer'
    Kanso\Core\Internal\Domain\Storage\ObjectStorageInterface: '@Kanso\Core\Internal\Infrastructure\Storage\S3ObjectStorage'
    Kanso\Core\Internal\Domain\Dashboard\DashboardQueryInterface: '@Kanso\Core\Internal\Infrastructure\Doctrine\DashboardQuery'
    Kanso\Core\Internal\Domain\Health\HealthCheckInterface: '@Kanso\Core\Internal\Infrastructure\Health\HealthChecker'
    Kanso\Core\Internal\Domain\Observability\MetricsInterface: '@Kanso\Core\Internal\Infrastructure\Observability\PrometheusMetrics'
    Kanso\Core\Internal\Domain\Observability\MetricsExporterInterface: '@Kanso\Core\Internal\Infrastructure\Observability\PrometheusMetrics'

    Kanso\Core\Internal\Infrastructure\Security\LexikAccessTokenIssuer:
        arguments:
            $ttl: '%lexik_jwt_authentication.token_ttl%'

    # An API key and a JWT both arrive as `Authorization: Bearer …`; this keeps
    # the two authenticators from both claiming the same request.
    Kanso\Core\Internal\Infrastructure\Security\JwtTokenExtractor:
        decorates: 'lexik_jwt_authentication.extractor.chain_extractor'
        arguments:
            $inner: '@.inner'

    Kanso\Core\Internal\Api\Controller\MetricsController:
        arguments:
            $sources: !tagged_iterator kanso.metric_source

    Kanso\Core\Internal\Infrastructure\Observability\InstallationMetrics:
        arguments:
            # The transports as configured, by name. A locator, because the
            # names are all this wants — nothing here consumes a queue.
            $transports: !tagged_locator { tag: 'messenger.receiver', index_by: 'alias' }
            $version: '%kanso.version%'

    # Tracing (Pimsen ADR-026). The endpoint is the one thing an installation
    # sets; empty, the provider is a no-op and nothing is recorded or propagated.
    kanso.tracer_provider:
        class: OpenTelemetry\API\Trace\TracerProviderInterface
        factory: ['Kanso\Core\Internal\Infrastructure\Observability\Tracing\TracerProviderFactory', 'create']
        arguments:
            $endpoint: '%env(string:default::OTEL_EXPORTER_OTLP_ENDPOINT)%'
            $version: '%kanso.version%'
            $environment: '%kernel.environment%'

    Kanso\Core\Internal\Infrastructure\Observability\Tracing\Tracing:
        arguments:
            $provider: '@kanso.tracer_provider'

    # Any S3-compatible store (as in Pimsen). `pathStyleEndpoint` is what makes
    # MinIO and most self-hosted stores work: the bucket is a path segment, not
    # a subdomain.
    AsyncAws\S3\S3Client:
        arguments:
            -
                endpoint: '%env(string:default::S3_ENDPOINT)%'
                accessKeyId: '%env(string:default::S3_KEY)%'
                accessKeySecret: '%env(string:default::S3_SECRET)%'
                region: '%env(string:default:kanso.s3.default_region:S3_REGION)%'
                pathStyleEndpoint: true

    # Signs URLs for browsers: same credentials, the address the browser can
    # reach; falls back to the internal endpoint where they are the same.
    kanso.s3.presigner:
        class: AsyncAws\S3\S3Client
        arguments:
            -
                endpoint: '%env(string:default:kanso.s3.endpoint:S3_PUBLIC_ENDPOINT)%'
                accessKeyId: '%env(string:default::S3_KEY)%'
                accessKeySecret: '%env(string:default::S3_SECRET)%'
                region: '%env(string:default:kanso.s3.default_region:S3_REGION)%'
                pathStyleEndpoint: true

    Kanso\Core\Internal\Infrastructure\Storage\S3ObjectStorage:
        arguments:
            $presigner: '@kanso.s3.presigner'
            $bucket: '%env(string:default::S3_BUCKET)%'

    Kanso\Core\Internal\Infrastructure\Document\TwigTemplateRenderer:
        arguments:
            $templateDir: '%kanso.document_templates%'

    Kanso\Core\Internal\Infrastructure\Document\DompdfRenderer:
        arguments:
            $templateDir: '%kanso.document_templates%'

    # Redis serves cache, locks, refresh tokens and metric counters — never queue data.
    Redis:
        class: Redis
        factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
        arguments:
            - '%env(REDIS_URL)%'
            - { lazy: true }

when@test:
    services:
        # Tracing on, into memory: the suite reads back the spans a request
        # and the messages it dispatched produced.
        kanso.tracing.exporter:
            class: OpenTelemetry\SDK\Trace\SpanExporter\InMemoryExporter
            public: true

        kanso.tracer_provider:
            class: OpenTelemetry\API\Trace\TracerProviderInterface
            factory: ['Kanso\Core\Internal\Infrastructure\Observability\Tracing\TracerProviderFactory', 'create']
            arguments:
                $endpoint: ''
                $version: '%kanso.version%'
                $environment: '%kernel.environment%'
                $exporter: '@kanso.tracing.exporter'

        # The suite flushes its Redis database, so it must not share one with a
        # running installation.
        Redis:
            class: Redis
            factory: ['Symfony\Component\Cache\Adapter\RedisAdapter', 'createConnection']
            arguments:
                - '%env(REDIS_URL)%/%env(KANSO_TEST_REDIS_DB)%'
                - { lazy: true }
