security:
    password_hashers:
        Kanso\Core\Internal\Infrastructure\Security\AuthenticatedUser:
            # Argon2id through libsodium; `auto` would fall back to bcrypt in
            # the official images, which lack libargon2.
            algorithm: sodium

    providers:
        kanso_users:
            id: Kanso\Core\Internal\Infrastructure\Security\UserProvider

    role_hierarchy:
        ROLE_OPERATOR: [ROLE_VIEWER]
        ROLE_ADMIN: [ROLE_OPERATOR]

    firewalls:
        health:
            pattern: ^/health
            security: false
        # Not public: the reference proxy forwards `/`, `/api` and `/health`
        # only, so a scraper reaches the API container directly
        # (src/Api/Controller/MetricsController.php).
        metrics:
            pattern: ^/metrics$
            security: false
        api:
            pattern: ^/api
            # No sessions: every request carries its own credentials.
            stateless: true
            provider: kanso_users
            entry_point: Kanso\Core\Internal\Api\Http\ProblemEntryPoint
            access_denied_handler: Kanso\Core\Internal\Api\Http\ProblemAccessDeniedHandler
            custom_authenticators:
                # Runs only for `X-Api-Key` or `Bearer kso_…`; everything else falls through to JWT.
                - Kanso\Core\Internal\Infrastructure\Security\ApiKeyAuthenticator
            jwt: ~

    access_control:
        - { path: ^/api/auth/(login|refresh|logout)$, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Tests create users constantly; argon2id would dominate the runtime.
            Kanso\Core\Internal\Infrastructure\Security\AuthenticatedUser:
                algorithm: plaintext
                ignore_case: false
