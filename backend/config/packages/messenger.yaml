framework:
    messenger:
        failure_transport: failed

        # Queues are rows in `messenger_messages` in this installation's MySQL —
        # there is no broker (as in Pimsen). Integrations get their own
        # transports when they arrive (Phase 2).
        transports:
            async:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: async
                    auto_setup: false
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
            # Kept for customer extensions (project/, docs/extensions.md): their
            # own queue in the same table, with the core's retry and failure
            # handling, so a slow integration never holds up the core's jobs.
            ext:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: ext
                    auto_setup: false
                    redeliver_timeout: 300
                retry_strategy:
                    max_retries: 3
                    delay: 1000
                    multiplier: 3
            failed:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options: { queue_name: failed, auto_setup: false }

        routing: {}

        buses:
            messenger.bus.default:
                middleware:
                    # Workers are long-running, so isolation is engineered here.
                    - doctrine_ping_connection
                    - doctrine_close_connection
                    # A span where a message is sent and where it is handled,
                    # joined by the trace context it carries (Pimsen ADR-026).
                    - Kanso\Core\Internal\Infrastructure\Observability\Tracing\TracingMiddleware

when@test:
    framework:
        messenger:
            transports:
                async: 'in-memory://'
                ext: 'in-memory://'
                failed: 'in-memory://'
