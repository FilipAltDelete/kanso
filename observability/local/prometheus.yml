# The local scrape, set up the way observability/README.md asks any scrape of
# a Kanso installation to be: job "kanso", and the installation's slug on
# every series. Not a production configuration — one installation, one API
# container, no discovery.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/kanso/kanso-rules.yml
  - /etc/prometheus/kanso/kanso-alerts.yml

scrape_configs:
  - job_name: kanso
    metrics_path: /metrics
    static_configs:
      # The API container itself: /metrics is not routed by the proxy.
      - targets: ["api:8080"]
        labels:
          installation: local
