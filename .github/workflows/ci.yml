name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kanso_test
          MYSQL_USER: kanso
          MYSQL_PASSWORD: kanso
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      APP_ENV: test
      APP_SECRET: ci
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: doctrine://default

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # phpunit.xml.dist forces the compose service name `mysql`; here it is on localhost.
      - name: Map service names
        working-directory: .
        run: echo "127.0.0.1 mysql" | sudo tee -a /etc/hosts

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, apcu, redis, zip, bcmath, sodium
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Static analysis
        run: |
          vendor/bin/php-cs-fixer check --diff
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          vendor/bin/deptrac analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The images every installation runs. Publishing them to a registry is the
  # open Phase 0 decision (see ROADMAP.md); until then CI proves they build.
  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: api
          push: false
      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: worker
          push: false
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: web
          push: false
