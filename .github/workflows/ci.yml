name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kanso_test
          MYSQL_USER: kanso
          MYSQL_PASSWORD: kanso
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      APP_ENV: test
      APP_SECRET: ci
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: doctrine://default

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      # phpunit.xml.dist forces the compose service names `mysql` and `minio`; here they are on localhost.
      - name: Map service names
        working-directory: .
        run: echo "127.0.0.1 mysql minio" | sudo tee -a /etc/hosts

      # MinIO needs `server /data` as its command, which a service container
      # cannot override, so it runs as a step (as in Pimsen). Images from
      # quay.io: Docker Hub no longer serves minio/minio to anonymous pulls.
      - name: Object storage
        working-directory: .
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=kanso -e MINIO_ROOT_PASSWORD=kanso-secret \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -fsS http://minio:9000/minio/health/live > /dev/null && break
            sleep 2
          done
          docker run --rm --network host quay.io/minio/mc:latest /bin/sh -c \
            "mc alias set local http://127.0.0.1:9000 kanso kanso-secret && mc mb --ignore-existing local/kanso-test"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, apcu, redis, zip, bcmath, sodium
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: backend

      - name: Static analysis
        run: |
          vendor/bin/php-cs-fixer check --diff
          vendor/bin/phpstan analyse --memory-limit=1G --no-progress
          vendor/bin/deptrac analyse --no-progress

      - name: Tests
        run: vendor/bin/phpunit

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The path a customer takes: a project that requires the core, registers it as
  # a bundle and adds its own. If this job fails, extensions are theory.
  project:
    name: Customer project
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kanso_project_test
          MYSQL_USER: kanso
          MYSQL_PASSWORD: kanso
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      APP_ENV: dev
      APP_SECRET: ci
      DATABASE_URL: "mysql://kanso:kanso@127.0.0.1:3306/kanso_project_test?serverVersion=8.4.0&charset=utf8mb4"
      REDIS_URL: redis://127.0.0.1:6379
      MESSENGER_TRANSPORT_DSN: doctrine://default

    defaults:
      run:
        working-directory: project

    steps:
      - uses: actions/checkout@v4

      # phpunit.xml.dist forces the compose service names; here they are on localhost.
      - name: Map service names
        working-directory: .
        run: echo "127.0.0.1 mysql redis" | sudo tee -a /etc/hosts

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, intl, apcu, redis, zip, bcmath, sodium
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          working-directory: project

      # Rule 4: an extension that imports Kanso\Core\Internal fails here, not on
      # the customer's next core upgrade.
      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress

      # One bad key in routes.yaml and the loader drops the whole file, the
      # core's routes included, while every other check still passes.
      - name: Routing
        run: |
          bin/console debug:router --format=txt > /tmp/routes.txt
          grep -q ' /api/auth/login' /tmp/routes.txt
          grep -q ' /api/ext/acme/erp-sync' /tmp/routes.txt

      - name: Tests
        run: vendor/bin/phpunit

  # The alert and recording rules operators load (observability/). A rule that
  # does not parse, or an alert that no longer fires when it should, fails here.
  observability:
    name: Observability rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make observability-check

  # The main operator flows in a real browser (e2e/): the compose stack with
  # this commit's API, and its frontend built as production serves it.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: make install
      - name: Start the installation
        run: |
          make keys
          docker compose up -d --build --wait api worker proxy
      - name: Run the suite
        env:
          CI: 'true'
        run: make e2e
      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # The images every installation runs. Publishing them to a registry is the
  # deferred deploy-target decision (see ROADMAP.md); until then CI proves they build.
  images:
    name: Images
    runs-on: ubuntu-latest
    needs: [backend, frontend, project, observability]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: api
          push: false
      - name: worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/api/Dockerfile
          target: worker
          push: false
      - name: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile
          target: web
          push: false
